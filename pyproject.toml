[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer-pro"
version = "2.0.0"
description = "Organizador inteligente e sentinela automatizado de arquivos para Windows e Linux."
readme = "README.md"
authors = [{ name = "Bruno Amorim" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "ttkbootstrap>=2.2.3",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
file-organizer = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
